version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - musttag
    - nilerr
    - nilnesserr
    - nolintlint
    - predeclared
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
        - (*os.File).Close
    govet:
      disable:
        - fieldalignment
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
